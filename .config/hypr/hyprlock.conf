#source = /home/justin/.cache/wal/colors-hyprland.conf

# Background
background {
    monitor =
    path = screenshot
    #path = /home/.wallpapers/wal.png
    #color = $background
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# General
general {
    hide_cursor = true
}

# Password input field
input-field {
    monitor =
    size = 350, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.5)
    inner_color = rgba(0, 0, 0, 0.6)
    font_color = rgba(255,255,255, 0.2)
    fade_on_empty = false
    rounding = 10
    check_color = rgb(204, 136, 34)
    placeholder_text = <small><span foreground="##cdd6f4">Ваш пароль...</span></small>
    hide_input = false

    capslock_color = rgba(255, 0, 0, 0.8)
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off

    position = 0, -300
    halign = center
    valign = center
}

# Current date
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %d %B")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = Noto Sans
  position = 0, 450
  halign = center
  valign = center
}

# Current time
# First hour digit
label {
  monitor =
  text = cmd[update:1000] HOUR=$(date +%H | cut -c1);[[ "$HOUR" -eq 0 ]] && echo "" || echo "$HOUR"
  color = rgba(41, 88, 174, 0.75)
  font_size = 340
  font_family = SF Pro Rounded Black
  position = -420, 100
  halign = center
  valign = center
}
# Second hour digit
label {
  monitor =
  text = cmd[update:1000] echo "$(date +%H | cut -c2)"
  color = rgba(105, 125, 151, 0.75)
  font_size = 340
  font_family = SF Pro Rounded Black
  position = -200, 100
  halign = center
  valign = center
}
# First minute digit
label {
  monitor =
  text = cmd[update:1000] echo "$(date +%M | cut -c1)"
  color = rgba(41,88,174, 0.75)
  font_size = 340
  font_family = SF Pro Rounded Black
  position = 120, 100
  halign = center
  valign = center
}
# Second minute digit
label {
  monitor =
  text = cmd[update:1000] echo "$(date +%M | cut -c2)"
  color = rgba(105, 125, 151, 0.75)
  font_size = 340
  font_family = SF Pro Rounded Black
  position = 360, 100
  halign = center
  valign = center
}
# Hour and minute separator
label {
  monitor =
  text = :
  color = rgba(242, 243, 244, 0.9)
  font_size = 300
  font_family = SF Pro Rounded Black
  position = -40, 140
  halign = center
  valign = center
}

