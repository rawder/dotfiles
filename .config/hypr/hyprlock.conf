# User greeting
label {
    monitor =
    # Set yout user's full name by "sudo chfn -f "Firstname Lastname" $USER"
    text = cmd[update:100000] echo "С возвращением, $(getent passwd "$USER" | cut -d: -f5 | cut -d, -f1)!"
    color = rgb(255,255,255)
    font_size = 24
    font_family = Inter
    position = 0, -230
    halign = center
    valign = center
}

# Keyboard layout
shape {
    monitor =
    size = 42, 40
    color = rgba(128, 128, 128, 0)
    rounding = 3
    border_size = 2
    border_color= rgba(255, 255, 255, 0.5)
    rotate = 0
    xray = false
    position = -20, 10
    halign = right
    valign = bottom
}


label {
    monitor =
    text = $LAYOUT[Eng, Rus]
    color = rgb(255,255,255)
    font_size = 12
    position = -28, 22
    halign = right
    valign = bottom
}

# Capslock indicator
label {
    monitor =
    text = cmd[update:1000] hyprctl -j devices | jq -r '.keyboards[] | select(.main == true) | if .capsLock == false then "" else "Capslock ON" end'
    color = rgba(255, 0, 0, 0.8)
    font_size = 14
    position = 0, -350
    halign = center
    valign = center
}

