#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

autogenerated = 0 # remove this line or set to 0 to remove the warning

debug {
    disable_logs = true
    enable_stdout_logs = false
}

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = ,preferred,auto,auto
monitor = eDP-1,1920x1080@60,0x0,1.25

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

# Some defaults
$Cursors = VolantesLightCursors
$Cursor_size = 32
$Icons = Papirus-Dark
$Theme = Nordic-darker-v40
$Font = Inter Display 9

env = XCURSOR_THEME,$Cursors
env = XCURSOR_SIZE,$Cursor_size
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = BEMENU_BACKEND,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_FONT_DPI,100
env = MOZ_ENABLE_WAYLAND,1
env = LIBVA_DRIVER_NAME,radeonsi
env = GTK_THEME,$Theme
env = GTK_ICON_THEME,$Icons
env = GOPATH,~/.local/go/

# Executie your apps at launch
# exec-once = waybar & hyprpaper & firefox

exec-once = rfkill unblock wlan
exec-once = rfkill unblock bluetooth
exec-once = iwctl station wlan0 scan

exec-once = gsettings set org.gnome.desktop.interface gtk-theme $Theme
exec-once = gsettings set org.gnome.desktop.wm.preferences theme $Theme
exec-once = gsettings set org.gnome.desktop.interface cursor-theme $Cursors
exec-once = gsettings set org.gnome.desktop.interface cursor-size $Cursor_size
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface icon-theme $Icons
exec-once = gsettings set org.gnome.desktop.interface font-antialiasing "'rgba'"
exec-once = gsettings set org.gnome.desktop.interface font-name $Font
exec-once = gsettings set com.github.stunkymonkey.nautilus-open-any-terminal terminal kitty
exec-once = gsettings set com.github.stunkymonkey.nautilus-open-any-terminal keybindings '<Ctrl><Alt>t'
exec-once = gsettings set com.github.stunkymonkey.nautilus-open-any-terminal new-tab true

exec-once = hyprpaper
exec-once = hyprlock
exec-once = waybar
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = notify_updates

# OBS workaround
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
 #   kb_variant =
 #   kb_model =
 #   kb_rules =
    repeat_delay = 300
    repeat_rate = 20
    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 0
    border_size = 1

    resize_on_border = true

    col.active_border = rgba(33ccffee) rgba(595959aa) 45deg
    col.inactive_border = rgba(595959aa)

    layout = master
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more 
    rounding = 5
    dim_inactive = true
    dim_strength = 0.3

    blur {
        enabled = false
        size = 8
        passes = 1
    }

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
#    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    #animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
#    workspace_swipe = off
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    col.splash = 0xffffff00
    vfr = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
#device:epic-mouse-v1 {
#    sensitivity = -0.5
#}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
#
windowrule = match:class ^(showmethekey-gtk)$, float on
windowrule = match:class ^(firefox)$, workspace 2
windowrule = match:class ^(kitty)$, workspace 1
windowrule = match:class ^(org.telegram.desktop)$, workspace 5
windowrule = match:class ^(org.fooyin.fooyin)$, workspace 7
windowrule = match:class ^(polkit-gnome-authentication-agent-1)$, stay_focused on
windowrule = match:class ^(wofi)$, no_anim on 
windowrule = match:class ^(wofi)$, stay_focused on

# JOSM dialogs workaround
windowrule = match:title ^(Редактор OpenStreetMap на Java*), tile on
windowrule = match:title ^(Скачать)$, stay_focused on
windowrule = match:title ^(Error)$, stay_focused on
windowrule = match:title ^(Добавить тег)$, stay_focused on
windowrule = match:title ^(Изменить отношение*), stay_focused on
windowrule = match:title ^(Отправить на сервер*), stay_focused on
windowrule = match:title ^(Изменить значение*), stay_focused on
windowrule = match:title ^(Изменить значение*), size 620 205

# Workspace rules
# Replace no_gaps_when_only
workspace = w[t1], gapsin:0, gapsout:0, border:0
workspace = w[tg1], gapsin:0, gapsout:0, border:0
workspace = f[1], gapsin:0, gapsout:0, border:0

# Layer rules
# Blur
layerrule = match:class ^(swww)$, blur true
layerrule = match:class logout_dialog, blur true

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, code:36, exec, kitty #SUPER+Enter
bind = $mainMod, Q, killactive,
bind = $mainMod CTRL, Q, exec, wlogout --show-binds --no-span --buttons-per-row 5 --margin-top 340 --margin-bottom 340
bind = $mainMod, E, exec, nautilus
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
binde = $mainMod, left, movefocus, l
binde = $mainMod, right, movefocus, r
binde = $mainMod, up, movefocus, u
binde = $mainMod, down, movefocus, d

# Move window with mainMod + Shift + arrow keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize active window with mainMod + Ctrl + arrow keys
binde = $mainMod CTRL, left, resizeactive,-10 0 
binde = $mainMod CTRL, right, resizeactive,10 0
binde = $mainMod CTRL, up, resizeactive,0 -10
binde = $mainMod CTRL, down, resizeactive,0 10

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume and Media Control
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Screen brightness
binde = , XF86MonBrightnessUp, exec, brightnessctl s +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = $mainMod SHIFT, N, exec, brightnessctl s 40%
bind = $mainMod CTRL, N, exec, brightnessctl s 100%


# $mod+PrintScreen — area screenshot, PrintScreen — fullscreen screenshot.
$picturefilename = $(xdg-user-dir PICTURES)/screen-"$(date +%s)".png

bind = ,Print, exec, grim $picturefilename
bind = $mainMod, Print, exec, grim -g "$(slurp)" $picturefilename
bind = $mainMod SHIFT, Print, exec, hyprctl -j activewindow | jq -r "\"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])\"" | grim -g - $picturefilename

